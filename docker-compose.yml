# 使用预构建镜像（推荐，Unraid 上直接用这份）
#   拉取最新镜像：docker compose pull && docker compose up -d
#
# 想从本机源码自己构建，改用：
#   docker compose -f docker-compose.build.yml up -d --build
services:
  bambu-spool:
    image: ghcr.io/mjy378283319/bambu-spool:latest
    container_name: bambu-spool
    restart: unless-stopped
    ports:
      - "8971:8971"
    environment:
      # 拓竹账号区域：china（中国大陆）/ global（海外）
      BAMBU_REGION: china

      # 容器内运行身份。99:100 = Unraid 的 nobody:users，能让挂载目录权限正常
      PUID: 99
      PGID: 100

      # 建议设置一个访问口令，尤其是端口暴露到内网以外时
      # APP_PASSWORD: "换成你的口令"

      # 通知推送（可选）：ntfy / Bark / 企业微信机器人等任意接收 POST JSON 的地址
      # NOTIFY_WEBHOOK: "https://ntfy.sh/你的主题"

      # 云端任务历史轮询间隔（秒）。打印结束后最长要等这么久才扣重
      TASK_POLL_INTERVAL: 60

      # 打印失败的任务是否也按进度比例扣重
      DEDUCT_ON_FAILURE: "true"
    volumes:
      # 数据库与加密密钥都放这里，务必持久化
      - ./data:/data
